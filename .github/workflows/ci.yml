name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm audit
      - run: npm run package
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: pip install cfn-lint==1.60.0
      - run: cfn-lint infra/template.json
      # Hosted Ubuntu already supplies Chromium libraries; avoid unrelated apt/font
      # downloads. CI fails closed if the pinned browser cannot actually launch.
      - run: npx playwright install chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: recovery-browser-screenshots
          path: /tmp/shift-recovery-*.png
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-not-a-real-secret
          POSTGRES_DB: shift_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/postgres*.test.mjs
        env:
          SHIFT_POSTGRES_TEST_URL: postgres://postgres:ci-only-not-a-real-secret@localhost:5432/shift_test
      - run: npm run package:azure -- --release-commit "$GITHUB_SHA"
      - name: Freeze tested Azure package
        run: |
          (cd build/azure && zip -q -r ../azure-release.zip .)
          cd build
          sha256sum azure-release.zip > azure-release.zip.sha256
          printf '%s\n' "$GITHUB_SHA" > release-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: azure-release-${{ github.sha }}
          path: |
            build/azure-release.zip
            build/azure-release.zip.sha256
            build/release-commit.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - run: az bicep install --version v0.44.1
      - run: az bicep build --file infra/azure/main.bicep --outfile /tmp/shift-azure.json
      - run: az bicep build --file infra/azure/database-regional.bicep --outfile /tmp/shift-azure-regional.json


  deploy-azure:
    # Deliberately inert until approved exact-main-ref OIDC trust, roles, storage
    # and the live response profile are verified; repository enable variable defaults off.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SHIFT_AZURE_DEPLOY_ENABLED == 'true'
    needs: [validate, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      id-token: write
    concurrency:
      group: shift-staging-azure-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: azure-release-${{ github.sha }}
          path: release
      - name: Verify immutable artifact and current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat release/release-commit.txt)" = "$GITHUB_SHA"
          (cd release && sha256sum --check azure-release.zip.sha256)
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ vars.SHIFT_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.SHIFT_AZURE_TENANT_ID }}
          subscription-id: ddb0b48c-aa74-4420-bf1b-49a3f7eaa970
          enable-AzPSSession: false
      - name: Deploy verified package without changing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          digest="$(sha256sum release/azure-release.zip | cut -d ' ' -f1)"
          python scripts/azure-ci-deploy.py --artifact release/azure-release.zip --commit "$GITHUB_SHA" --sha256 "$digest"
